[project]
name = "ai-web-signals"
version = "0.1.0"
description = "Collect public AI-related web signals across the Tranco Top 100,000 standard domains."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx[http2]>=0.28.1",
]

[project.urls]
Repository = "https://github.com/derailable/ai-web-signals"
Documentation = "https://github.com/derailable/ai-web-signals#readme"
"Data source" = "https://tranco-list.eu"

[dependency-groups]
dev = [
  "ruff>=0.14.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pyrefly]
python-interpreter-path = ".venv/bin/python3"
