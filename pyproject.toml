[project]
name = "ai-web-signals"
version = "0.1.0"
description = "Collect public AI-related web signals across popular domains sourced from Cloudflare Radar."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx[http2]>=0.28.1",
]

[project.urls]
Repository = "https://github.com/TypeError/ai-web-signals"
Documentation = "https://github.com/TypeError/ai-web-signals#readme"
"Data source" = "https://radar.cloudflare.com/domains"

[dependency-groups]
dev = [
  "ruff>=0.14.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
